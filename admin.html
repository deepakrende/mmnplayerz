<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MMN · Admin</title>
<style>
:root{--bg:#0b1020;--panel:#141b33;--raise:#1d2547;--line:#27305a;--text:#edf0ff;--dim:#8f99c4;--acc:#8b7bff;--acc2:#bdb3ff;--ok:#5fd6a0;--warn:#ffb86b;--err:#ff7a8a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}
main{max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.logo i:after{content:"";border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.logo b{font-size:20px}.logo span{color:var(--dim)}
button,select,input,textarea{font:inherit;color:var(--text)}
button{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.sm{padding:5px 10px;font-size:13px}
button.danger{color:var(--err)}
input,select,textarea{background:#0d1328;border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.login{max-width:380px;margin:12vh auto 0}
.login h1{font-size:22px;margin:0 0 4px}.login p{color:var(--dim);margin:0 0 8px}
.err{color:var(--err);min-height:1.4em;font-size:14px;margin-top:10px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);font-size:14px}
.banner.bad{background:#3a1822;border-color:#7a2c3d}.banner.warn{background:#3a2c14;border-color:#7a5a22}.banner.ok{background:#12301f;border-color:#235c3b;color:#bff0d6;padding:7px 12px;display:inline-block;margin:0}
.banner ol{margin:6px 0 0;padding-left:20px}.banner li{margin:2px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:24px;line-height:1.2}.tile span{color:var(--dim);font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.tools input{flex:1;min-width:180px}.tools select{width:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--dim);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.name{font-weight:600}.note{color:var(--dim);font-size:12px}
.code{font:600 13px ui-monospace,Consolas,monospace;letter-spacing:1px}
.badge{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:#235c3b}.badge.warn{color:var(--warn);border-color:#7a5a22}.badge.bad{color:var(--err);border-color:#7a2c3d}.badge.mute{color:var(--dim)}
.dim{color:var(--dim)}.nowrap{white-space:nowrap}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
details{position:relative}summary{list-style:none;cursor:pointer;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px}
summary::-webkit-details-marker{display:none}
details[open] .menu{display:flex}
.menu{display:none;position:absolute;right:0;top:34px;z-index:5;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 10px 30px #0008}
.menu button{background:transparent;border:0;text-align:left;border-radius:7px;padding:8px 10px}.menu button:hover{background:var(--raise)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(480px,92vw)}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 4px;font-size:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dlgact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
pre.msg{white-space:pre-wrap;background:#0d1328;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0 0;font:13px/1.5 inherit}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--acc);border-radius:10px;padding:10px 16px;z-index:20;max-width:90vw}
#toast.bad{border-color:var(--err)}
.empty{padding:26px;text-align:center;color:var(--dim)}
@media(max-width:860px){
 table,tbody,tr,td{display:block}thead{display:none}
 tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 4px;background:var(--panel)}
 td{border:0;padding:4px 12px}
 td[data-l]::before{content:attr(data-l) ": ";color:var(--dim);font-size:12px}
 .menu{right:auto;left:0}
}
</style>
</head>
<body>
<main>
 <section id="login" class="card login" hidden>
  <h1>MMN Admin</h1>
  <p>Sign in to manage member access codes.</p>
  <form id="lf">
   <label for="pw">Admin password</label>
   <input id="pw" type="password" autocomplete="current-password" autofocus>
   <div class="err" id="lerr" role="alert"></div>
   <button class="pri" style="width:100%;margin-top:6px" id="lbtn">Sign in</button>
  </form>
 </section>

 <section id="app" hidden>
  <header>
   <div class="logo"><i></i><b>MMN</b><span>Admin</span></div>
   <span id="saved" class="banner ok" hidden>Saved on disk</span>
   <button id="add" class="pri">+ Add member</button>
   <button id="out">Log out</button>
  </header>

  <div id="storebanner"></div>

  <div class="tiles">
   <div class="tile"><b id="t1">0</b><span>Active members</span></div>
   <div class="tile"><b id="t2">0</b><span>Watching now</span></div>
   <div class="tile"><b id="t3">0</b><span>Data used today</span></div>
   <div class="tile"><b id="t4">0</b><span>Data used this month</span></div>
  </div>

  <div class="card">
   <div class="tools">
    <input id="q" type="search" placeholder="Search by name, note or code" aria-label="Search members">
    <select id="flt" aria-label="Filter members">
     <option value="all">All members</option><option value="active">Active</option><option value="soon">Expiring in 7 days</option><option value="expired">Expired</option><option value="paused">Paused</option>
    </select>
   </div>
   <table>
    <thead><tr><th>Member</th><th>Code</th><th>Valid until</th><th>Devices</th><th>Watching</th><th>Data today / month</th><th>Last seen</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
   </table>
   <div id="empty" class="empty" hidden></div>
  </div>
 </section>
</main>

<dialog id="dlg">
 <form id="df" method="dialog">
  <h2 id="dtitle">Add member</h2>
  <label for="fn">Name</label>
  <input id="fn" maxlength="60" required autocomplete="off">
  <label for="fnote">Note (optional, only you see it)</label>
  <input id="fnote" maxlength="200" placeholder="e.g. phone number, paid until…" autocomplete="off">
  <label for="fc">Access code</label>
  <input id="fc" class="code" autocomplete="off" spellcheck="false" placeholder="Leave empty to make one automatically" style="text-transform:uppercase">
  <label for="fe">Valid until (end of that day, India time)</label>
  <input id="fe" type="date">
  <div class="chips">
   <button type="button" class="sm" data-add="30">+30 days</button><button type="button" class="sm" data-add="90">+90 days</button><button type="button" class="sm" data-add="365">+1 year</button><button type="button" class="sm" data-add="0">Never expires</button>
  </div>
  <div class="row2">
   <div><label for="fd">Devices allowed</label><input id="fd" type="number" min="1" max="20" value="3"></div>
   <div><label for="fs">Watching at once</label><input id="fs" type="number" min="1" max="10" value="1"></div>
  </div>
  <div class="err" id="derr" role="alert"></div>
  <div class="dlgact"><button type="button" id="dcancel">Cancel</button><button class="pri" id="dsave">Save</button></div>
 </form>
</dialog>

<dialog id="mdlg">
 <h2>Message for <span id="mname"></span></h2>
 <p class="dim" style="margin:4px 0 0">Copy this and send it to the member.</p>
 <pre class="msg" id="mtext"></pre>
 <div class="dlgact"><button id="mclose">Close</button><button class="pri" id="mcopy">Copy message</button></div>
</dialog>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
const $=id=>document.getElementById(id);
let members=[],editing=null,timer=null;
const shown=new Set();

async function api(method,path,body){
 const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Admin':'1'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
 let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&j.error==='login'){showLogin();throw new Error('login')}
 if(!r.ok)throw new Error(j.error||('Error '+r.status));
 return j;
}
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function showLogin(){$('app').hidden=true;$('login').hidden=false;clearInterval(timer);$('pw').focus()}
function showApp(){$('login').hidden=true;$('app').hidden=false;clearInterval(timer);timer=setInterval(()=>{if(!$('dlg').open&&!$('mdlg').open)load()},15000)}

$('lf').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';$('lbtn').disabled=true;
 try{await api('POST','/admin/login',{password:$('pw').value});$('pw').value='';await load()}catch(x){if(x.message!=='login')$('lerr').textContent=x.message}
 $('lbtn').disabled=false};
$('out').onclick=async()=>{try{await api('POST','/admin/logout')}catch(e){}showLogin()};

const mb=n=>n>=1000?(n/1000).toFixed(1)+' GB':n+' MB';
const day=ms=>new Date(ms).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kolkata'});
const istDate=ms=>new Date(ms).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
function status(m,now){
 if(m.paused)return{k:'paused',t:'Paused',c:'mute'};
 if(m.expires!=null&&m.expires<now)return{k:'expired',t:'Expired',c:'bad'};
 if(m.expires!=null){const d=Math.ceil((m.expires-now)/86400000);if(d<=7)return{k:'soon',t:d<=1?'Last day':d+' days left',c:'warn'}}
 return{k:'active',t:'Active',c:'ok'};
}
function ago(ms,now){if(!ms)return'never';const s=Math.max(0,Math.round((now-ms)/1000));if(s<90)return'just now';if(s<5400)return Math.round(s/60)+' min ago';if(s<172800)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' days ago'}

async function load(){
 let st;try{st=await api('GET','/admin/api/state')}catch(e){if(e.message!=='login')toast(e.message,true);return}
 members=st.members;showApp();renderStore(st.storage);render(st.now);
}
function renderStore(s){
 const b=$('storebanner'),ok=$('saved');b.textContent='';ok.hidden=true;
 const box=(cls,html)=>{const d=document.createElement('div');d.className='banner '+cls;d.innerHTML=html;b.appendChild(d)};
 if(s.error)box('bad','<b>Could not save to disk:</b> '+String(s.error).replace(/[<>&]/g,'')+'. Changes made now will be lost on the next restart.');
 else if(!s.persistent)box('bad','<b>Changes are not being saved.</b> Members will disappear when the site restarts or redeploys. To fix it, in Render: open your service, go to <b>Disks</b>, add a disk with mount path <b>/data</b>, then under <b>Environment</b> add <b>DATA_DIR</b> = <b>/data</b>. Then restart.');
 else if(!s.mounted)box('warn','<b>Heads up:</b> the save folder does not look like a separate Render Disk, so it may be wiped when you deploy. Check that your disk is mounted at the same path as DATA_DIR.');
 else ok.hidden=false;
}
function render(now){
 const q=$('q').value.trim().toLowerCase(),f=$('flt').value;
 let act=0,watch=0,td=0,mo=0;
 members.forEach(m=>{const s=status(m,now);if(s.k==='active'||s.k==='soon')act++;watch+=m.watching?1:0;td+=m.usage.today;mo+=m.usage.month});
 $('t1').textContent=act+' / '+members.length;$('t2').textContent=watch;$('t3').textContent=mb(td);$('t4').textContent=mb(mo);
 const list=members.filter(m=>{
  const s=status(m,now);
  if(f!=='all'&&s.k!==f&&!(f==='active'&&s.k==='soon'))return false;
  if(!q)return true;
  return (m.name+' '+m.note+' '+m.code).toLowerCase().includes(q);
 }).sort((a,b)=>(a.expires??Infinity)-(b.expires??Infinity)||a.name.localeCompare(b.name));
 const rows=$('rows');rows.textContent='';
 $('empty').hidden=list.length>0;
 if(!list.length)$('empty').textContent=members.length?'No members match.':'No members yet. Press “+ Add member” to create the first access code.';
 list.forEach(m=>{
  const s=status(m,now),tr=document.createElement('tr');
  const td=(label,node)=>{const c=document.createElement('td');if(label)c.dataset.l=label;if(typeof node==='string')c.textContent=node;else if(node)c.appendChild(node);tr.appendChild(c);return c};
  const nm=document.createElement('div');const b=document.createElement('div');b.className='name';b.textContent=m.name;nm.appendChild(b);
  if(m.note){const n=document.createElement('div');n.className='note';n.textContent=m.note;nm.appendChild(n)}
  td('',nm);
  const cw=document.createElement('div');cw.className='acts';const cs=document.createElement('span');cs.className='code';
  cs.textContent=shown.has(m.id)?m.code:m.code.slice(0,4)+'-••••-••••';
  const sb=btn(shown.has(m.id)?'Hide':'Show',()=>{shown.has(m.id)?shown.delete(m.id):shown.add(m.id);render(now)});
  const cb=btn('Copy',async()=>{await copy(m.code);toast('Code copied')});
  cw.append(cs,sb,cb);td('Code',cw);
  const vu=document.createElement('div');const d1=document.createElement('div');d1.className='nowrap';d1.textContent=m.expires==null?'Never':day(m.expires);
  const bd=document.createElement('span');bd.className='badge '+s.c;bd.textContent=s.t;vu.append(d1,bd);td('Valid until',vu);
  td('Devices',m.devicesUsed+' of '+m.devices);
  {const w=td('Watching',m.watching?'Watching now':'—');w.title='This code may watch on '+m.screens+' device'+(m.screens>1?'s':'')+' at once'}
  td('Data',mb(m.usage.today)+' / '+mb(m.usage.month));
  td('Last seen',ago(m.lastSeen,now));
  const ac=document.createElement('div');ac.className='acts';
  ac.append(btn('Edit',()=>openEdit(m)),btn('+30 days',()=>extend(m,now)),btn('Message',()=>openMsg(m)));
  const dt=document.createElement('details'),sm=document.createElement('summary');sm.textContent='More';
  const menu=document.createElement('div');menu.className='menu';
  menu.append(
   mbtn(m.paused?'Resume access':'Pause access',()=>act2(m,'PUT',{paused:!m.paused},m.paused?'Resumed':'Paused')),
   mbtn('Make a new code',()=>{if(confirm('Make a new code for '+m.name+'? The old code stops working and all their devices are signed out.'))act2(m,'POST','/newcode','New code ready')}),
   mbtn('Sign out all devices',()=>{if(confirm('Sign out every device of '+m.name+'? They can sign in again with their code.'))act2(m,'POST','/signout','Signed out')}),
   mbtn('Remove member',()=>{if(confirm('Remove '+m.name+'? They are signed out immediately and their code stops working.'))act2(m,'DELETE','','Removed')},true));
  dt.append(sm,menu);ac.appendChild(dt);td('',ac);
  rows.appendChild(tr);
 });
}
function btn(t,fn){const b=document.createElement('button');b.className='sm';b.textContent=t;b.onclick=fn;return b}
function mbtn(t,fn,danger){const b=document.createElement('button');b.textContent=t;if(danger)b.className='danger';b.onclick=()=>{b.closest('details').open=false;fn()};return b}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}
async function act2(m,method,x,okMsg){
 try{
  if(method==='PUT')await api('PUT','/admin/api/members/'+m.id,x);
  else if(method==='DELETE')await api('DELETE','/admin/api/members/'+m.id);
  else await api('POST','/admin/api/members/'+m.id+x);
  toast(okMsg);await load();
 }catch(e){if(e.message!=='login')toast(e.message,true)}
}
async function extend(m,now){
 const base=m.expires!=null&&m.expires>now?m.expires:now;
 try{await api('PUT','/admin/api/members/'+m.id,{expires:istDate(base+30*86400000)});toast('Extended by 30 days');await load()}catch(e){if(e.message!=='login')toast(e.message,true)}
}

/* add / edit dialog */
function addDays(n){return n?istDate(Date.now()+n*86400000):''}
function openAdd(){
 editing=null;$('dtitle').textContent='Add member';$('fn').value='';$('fnote').value='';$('fc').value='';$('fc').placeholder='Leave empty to make one automatically';
 $('fe').value=addDays(30);$('fd').value=3;$('fs').value=1;$('derr').textContent='';$('dlg').showModal();$('fn').focus();
}
function openEdit(m){
 editing=m;$('dtitle').textContent='Edit '+m.name;$('fn').value=m.name;$('fnote').value=m.note||'';$('fc').value=m.code;$('fc').placeholder='';
 $('fe').value=m.expiresDate||'';$('fd').value=m.devices;$('fs').value=m.screens;$('derr').textContent='';$('dlg').showModal();
}
$('add').onclick=openAdd;
$('dcancel').onclick=()=>$('dlg').close();
document.querySelectorAll('#dlg [data-add]').forEach(b=>b.onclick=()=>{
 const n=+b.dataset.add;if(!n){$('fe').value='';return}
 const cur=$('fe').value&&new Date($('fe').value+'T00:00:00+05:30').getTime()>Date.now()?new Date($('fe').value+'T12:00:00+05:30').getTime():Date.now();
 $('fe').value=istDate(cur+n*86400000);
});
$('df').onsubmit=async e=>{
 e.preventDefault();$('derr').textContent='';$('dsave').disabled=true;
 const body={name:$('fn').value,note:$('fnote').value,expires:$('fe').value,devices:+$('fd').value,screens:+$('fs').value};
 const code=$('fc').value.trim();if(code||editing)body.code=code;
 try{
  const r=editing?await api('PUT','/admin/api/members/'+editing.id,body):await api('POST','/admin/api/members',body);
  $('dlg').close();
  if(!r.saved)toast('Done, but it could not be saved to disk (see the red box).',true);else toast(editing?'Saved':'Member added');
  await load();
  if(!editing&&r.member)openMsg(r.member);
 }catch(x){if(x.message!=='login')$('derr').textContent=x.message}
 $('dsave').disabled=false;
};

/* message dialog */
function openMsg(m){
 const site=location.origin+'/app';
 const t=`Hi ${m.name}, here is your access code for MMN:\n\n${m.code}\n\nOpen ${site} and enter the code when asked.`+
  (m.expires!=null?`\nIt works until ${day(m.expires)}.`:'')+
  `\nPlease keep it private. It can be used on up to ${m.devices} device${m.devices>1?'s':''}${m.screens>1?` (${m.screens} watching at once)`:', one at a time'}.`;
 $('mname').textContent=m.name;$('mtext').textContent=t;$('mdlg').showModal();
}
$('mclose').onclick=()=>$('mdlg').close();
$('mcopy').onclick=async()=>{await copy($('mtext').textContent);toast('Message copied')};

$('q').oninput=()=>render(Date.now());$('flt').onchange=()=>render(Date.now());
load();
</script>
</body>
</html>
