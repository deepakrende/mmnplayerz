<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · MMN</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--panel:#141b33;--raise:#1d2547;--line:#27305a;--text:#edf0ff;--dim:#9aa4cc;--acc:#8b7bff;--acc2:#bdb3ff;--err:#ff8c9c;
--fd:"Bricolage Grotesque","Avenir Next","Segoe UI Variable Display",system-ui,sans-serif;--fb:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 1.05rem/1.5 var(--fb);padding:1.25rem}
.card{width:min(25rem,100%);animation:rise .6s ease both}
.brand{display:flex;align-items:center;gap:.7rem;margin-bottom:2rem;font:700 1.9rem/1 var(--fd);letter-spacing:-.02em}
.mark{width:2.6rem;height:2.6rem;border-radius:.8rem;background:var(--acc);display:grid;place-items:center;color:#140e40}
h1{margin:0 0 .4rem;font:700 1.7rem/1.1 var(--fd);letter-spacing:-.02em}
p.sub{margin:0 0 1.5rem;color:var(--dim)}
form{display:grid;gap:1rem}
.field{position:relative}
input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.95rem 4.5rem .95rem 1rem;color:var(--text);font:inherit;font-size:1.05rem}
input:focus{outline:0;border-color:var(--acc)}
.show{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--acc2);font:600 .9rem var(--fb);padding:.5rem .7rem;cursor:pointer;border-radius:8px}
.go{background:var(--acc);border:0;border-radius:14px;padding:1rem;color:#140e40;font:700 1.05rem var(--fd);cursor:pointer;transition:background .15s}
.go:hover{background:var(--acc2)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
.err{margin:0;padding:.7rem .9rem;border:1px solid #5a2a43;background:rgba(255,77,109,.1);color:var(--err);border-radius:12px}
.back{display:inline-block;margin-top:1.5rem;color:var(--dim);text-decoration:none}.back:hover{color:var(--text)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
 <div class="brand"><span class="mark"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>MMN</div>
 <h1>Sign in</h1>
 <p class="sub">Enter the access password to open the player.</p>
 <form method="post" action="/login">
  <input type="text" name="username" value="mmn" autocomplete="username" hidden>
  {{ERROR}}
  <div class="field">
   <input id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required aria-label="Password">
   <button class="show" type="button" id="sh" aria-pressed="false">Show</button>
  </div>
  <button class="go" type="submit">Open player</button>
 </form>
 <a class="back" href="/">Back to home</a>
</main>
<script>
document.getElementById('sh').onclick=function(){var p=document.getElementById('pw'),s=p.type==='password';p.type=s?'text':'password';this.textContent=s?'Hide':'Show';this.setAttribute('aria-pressed',s)};
</script>
</body>
</html>
